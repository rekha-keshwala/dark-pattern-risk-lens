
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Scanner</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="container">
    <h1>Page Scanner</h1>
    <p>Scan the current webpage elements.</p>

    <button id="scanBtn">Scan Page</button>

    <div id="results" class="results">
      <h3>Scan Results</h3>

      <p>Buttons: <strong id="buttonCount">-</strong></p>
      <p>Checkboxes: <strong id="checkboxCount">-</strong></p>
    </div>

    <p id="status"></p>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
